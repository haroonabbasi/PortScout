name: Release

on:
  push:
    tags:
      - 'v*'  # Triggers on tags like v1.0.5
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to release (e.g., v1.0.5)'
        required: true
        type: string

jobs:
  build-and-release:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for tags

      - name: Determine version
        id: version
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $TAG = "${{ github.event.inputs.tag }}"
          } else {
            $TAG = "${{ github.ref_name }}"
          }
          
          # Remove 'v' prefix if present
          $VERSION = $TAG -replace '^v', ''
          echo "version=$VERSION" >> $env:GITHUB_OUTPUT
          echo "tag=$TAG" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $VERSION"
          Write-Host "Tag: $TAG"
        shell: pwsh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r back-end/requirements.txt

      - name: Build executable with PyInstaller
        run: |
          pyinstaller portregistry.spec --clean
        shell: pwsh

      - name: Verify executable exists
        run: |
          if (Test-Path "dist\portregistry.exe") {
            Write-Host "Executable found at dist\portregistry.exe"
            $file = Get-Item "dist\portregistry.exe"
            Write-Host "File size: $($file.Length) bytes"
          } else {
            Write-Error "Executable not found at dist\portregistry.exe"
            exit 1
          }
        shell: pwsh

      - name: Generate SHA256 checksum
        id: checksum
        run: |
          $hash = (Get-FileHash -Path "dist\portregistry.exe" -Algorithm SHA256).Hash.ToLower()
          $checksumFile = "PortRegistry-v${{ steps.version.outputs.version }}.sha256.txt"
          $hash | Out-File -FilePath $checksumFile -Encoding utf8 -NoNewline
          Write-Host "Checksum: $hash"
          echo "checksum=$hash" >> $env:GITHUB_OUTPUT
          echo "checksum_file=$checksumFile" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Extract changelog for version
        id: changelog
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $changelogPath = "CHANGELOG.md"
          
          if (-not (Test-Path $changelogPath)) {
            Write-Host "CHANGELOG.md not found, using default release notes"
            $releaseNotes = "Release v$version"
            echo "notes<<EOF" >> $env:GITHUB_OUTPUT
            echo "$releaseNotes" >> $env:GITHUB_OUTPUT
            echo "EOF" >> $env:GITHUB_OUTPUT
            exit 0
          }
          
          $content = Get-Content $changelogPath -Raw
          
          # Pattern to match version section: ## [1.0.5] - date (optional)
          # Captures everything from the version header until next version header or end of file
          $escapedVersion = [regex]::Escape($version)
          $pattern = "(?s)##\s*\[$escapedVersion\][^\n]*(.*?)(?=\n##\s*\[|\z)"
          $match = [regex]::Match($content, $pattern)
          
          if ($match.Success) {
            $releaseNotes = $match.Groups[1].Value.Trim()
            Write-Host "Found changelog entry for version $version"
            Write-Host "Extracted notes length: $($releaseNotes.Length) characters"
          } else {
            Write-Host "No changelog entry found for version $version, using default"
            $releaseNotes = "Release v$version`n`nSee CHANGELOG.md for details."
          }
          
          # Escape for GitHub Actions output
          $releaseNotes = $releaseNotes -replace "`r`n", "`n" -replace "`r", "`n"
          echo "notes<<EOF" >> $env:GITHUB_OUTPUT
          echo "$releaseNotes" >> $env:GITHUB_OUTPUT
          echo "EOF" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body: ${{ steps.changelog.outputs.notes }}
          files: |
            dist/portregistry.exe
            PortRegistry-v${{ steps.version.outputs.version }}.sha256.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

