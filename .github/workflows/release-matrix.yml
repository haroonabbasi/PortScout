name: Release (matrix)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to release (e.g., v1.0.5)'
        required: true
        type: string

jobs:
  build-and-release:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        uses: actions/github-script@v6
        with:
          script: |
            const core = require('@actions/core')
            let tag = ''
            if (process.env.GITHUB_EVENT_NAME === 'workflow_dispatch') {
              tag = '${{ github.event.inputs.tag }}' || ''
            } else if (process.env.GITHUB_REF && process.env.GITHUB_REF.startsWith('refs/tags/')) {
              tag = process.env.GITHUB_REF.replace('refs/tags/', '')
            } else if (context.ref && context.ref.startsWith('refs/tags/')) {
              tag = context.ref.replace('refs/tags/', '')
            } else if (context.payload.ref_name) {
              tag = context.payload.ref_name
            }
            if (!tag) throw new Error('Tag not found')
            if (!/^v/.test(tag)) throw new Error("Tag must start with 'v' (e.g., v1.0.0)")
            const version = tag.replace(/^v/, '')
            core.setOutput('tag', tag)
            core.setOutput('version', version)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r back-end/requirements.txt

      - name: Build executable with PyInstaller (platform-specific)
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            pyinstaller portregistry.spec --clean
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            pyinstaller --name portregistry --windowed --add-data "dist:dist" back-end/server.py
          else
            pyinstaller --name portregistry --noconsole --onefile --add-data "dist:dist" back-end/server.py
          fi
        shell: bash

      - name: Platform packaging - Windows
        if: matrix.os == 'windows-latest'
        run: |
          # Install Inno Setup via Chocolatey if not present
          if (-not (Get-Command ISCC -ErrorAction SilentlyContinue)) {
            choco install innosetup -y
          }
          # Compile installer if ISCC available
          if (Test-Path '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe"') {
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" .\portregistry.iss
          } elseif (Get-Command ISCC -ErrorAction SilentlyContinue) {
            ISCC .\portregistry.iss
          } else {
            Write-Host 'Inno Setup compiler not found; skipping installer step.'
          }
        shell: pwsh

      - name: Platform packaging - macOS
        if: matrix.os == 'macos-latest'
        run: |
          # Create a compressed DMG from the .app (if produced)
          if [ -d "dist/portregistry.app" ]; then
            hdiutil create -volname PortRegistry -srcfolder dist/portregistry.app -ov -format UDZO PortRegistry.dmg
          else
            echo "dist/portregistry.app not found; skipping DMG creation"
          fi
        shell: bash

      - name: Platform packaging - Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Create a tar.gz of the dist folder (simple portable artifact)
          if [ -d dist ]; then
            tar -czf PortRegistry-linux-dist.tar.gz -C dist .
          else
            echo "dist not found; skipping tar creation"
          fi
        shell: bash

      - name: Collect release artifacts
        id: collect
        run: |
          rm -rf release-artifacts || true
          mkdir -p release-artifacts
          # Copy expected outputs into a single folder for upload
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp -v dist/portregistry.exe release-artifacts/ 2>/dev/null || true
            cp -v installer/PortRegistry_Setup.exe release-artifacts/ 2>/dev/null || true
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            if [ -f PortRegistry.dmg ]; then cp -v PortRegistry.dmg release-artifacts/; fi
            if [ -d dist/portregistry.app ]; then cp -r dist/portregistry.app release-artifacts/; fi
          else
            cp -v dist/portregistry release-artifacts/ 2>/dev/null || true
            cp -v PortRegistry-linux-dist.tar.gz release-artifacts/ 2>/dev/null || true
          fi
          ls -la release-artifacts || true
        shell: bash

      - name: Upload artifacts for aggregation
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.os }}
          path: release-artifacts

  aggregate-release:
    name: Aggregate artifacts and create release
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (for changelog access)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        uses: actions/github-script@v6
        with:
          script: |
            const core = require('@actions/core')
            let tag = ''
            if (process.env.GITHUB_EVENT_NAME === 'workflow_dispatch') {
              tag = '${{ github.event.inputs.tag }}' || ''
            } else if (process.env.GITHUB_REF && process.env.GITHUB_REF.startsWith('refs/tags/')) {
              tag = process.env.GITHUB_REF.replace('refs/tags/', '')
            } else if (context.ref && context.ref.startsWith('refs/tags/')) {
              tag = context.ref.replace('refs/tags/', '')
            } else if (context.payload.ref_name) {
              tag = context.payload.ref_name
            }
            if (!tag) throw new Error('Tag not found')
            if (!/^v/.test(tag)) throw new Error("Tag must start with 'v' (e.g., v1.0.0)")
            const version = tag.replace(/^v/, '')
            core.setOutput('tag', tag)
            core.setOutput('version', version)

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded files
        run: |
          echo "Downloaded artifacts:"
          find artifacts -type f -print

      - name: Generate combined SHA256 checksums
        run: |
          set -e
          mkdir -p checksums
          # Use sha256sum if available; fallback to shasum -a 256 on macOS
          if command -v sha256sum >/dev/null 2>&1; then
            find artifacts -type f -print0 | xargs -0 sha256sum > checksums/PortRegistry-all.sha256.txt || true
          else
            find artifacts -type f -print0 | xargs -0 shasum -a 256 > checksums/PortRegistry-all.sha256.txt || true
          fi
          ls -la checksums

      - name: Prepare files list for release
        id: filelist
        run: |
          # Collect all files (artifacts + checksum) into a newline-separated list for the release action
          mkdir -p release-attach
          cp -r artifacts/* release-attach/ || true
          cp checksums/PortRegistry-all.sha256.txt release-attach/ || true
          # Generate newline-separated list for GitHub Action output
          echo "files<<EOF" >> $GITHUB_OUTPUT
          find release-attach -type f -print
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and attach artifacts
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body: "Automated cross-platform build artifacts for ${{ steps.version.outputs.tag }}"
          files: ${{ steps.filelist.outputs.files }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
