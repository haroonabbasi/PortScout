name: Deploy Docs

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build with VitePress
        run: |
          # remove previous build output to avoid serving stale files
          rm -rf docs/.vitepress/dist
          # ensure public assets folder contains project assets so VitePress copies them
          rm -rf docs/.vitepress/public
          mkdir -p docs/.vitepress/public/assets
          if [ -d "assets" ]; then cp -r assets/* docs/.vitepress/public/assets/ || true; fi
          npm run docs:build
          touch docs/.vitepress/dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
